<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B4513" />
    <meta
      name="description"
      content="Кофейня Coffee & Books - уютное место для любителей кофе и книг. Забронируйте столик, посмотрите меню, узнайте о мероприятиях."
    />
    <meta name="keywords" content="кофейня, книги, кофе, Москва, бронирование, мероприятия, кафе" />
    <meta name="author" content="Coffee & Books" />
    
    <!-- Open Graph метатеги для соцсетей -->
    <meta property="og:title" content="Coffee & Books - Кофейня и книжный клуб" />
    <meta property="og:description" content="Уютное место, где встречаются ароматный кофе и увлекательные книги" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/images/og-image.jpg" />
    <meta property="og:url" content="https://coffee-books.ru" />
    
    <!-- Twitter Card метатеги -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coffee & Books - Кофейня и книжный клуб" />
    <meta name="twitter:description" content="Уютное место, где встречаются ароматный кофе и увлекательные книги" />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/og-image.jpg" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect для внешних ресурсов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Coffee & Books - Кофейня и книжный клуб</title>
    
    <style>
      /* Базовые стили для предотвращения FOUC (Flash of Unstyled Content) */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #ffffff;
      }
      
      /* Стили для загрузки */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 9999;
      }
      
      .loading-logo {
        font-size: 2.5rem;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      
      .loading-text {
        font-size: 1.2rem;
        opacity: 0.9;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>Требуется JavaScript</h1>
        <p>Для работы приложения Coffee & Books необходимо включить JavaScript в вашем браузере.</p>
        <p>Please enable JavaScript to run this app.</p>
      </div>
    </noscript>
    
    <!-- Экран загрузки -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo"> Coffee & Books</div>
      <div class="loading-text">Загружаем уютную атмосферу...</div>
    </div>
    
    <!-- Корневой элемент React приложения -->
    <div id="root"></div>
    
    <script>
      // Скрипт для скрытия экрана загрузки
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease';
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
      
      // Обработка ошибок загрузки
      window.addEventListener('error', function(e) {
        console.error('Application error:', e.error);
      });
    </script>
  </body>
</html>
